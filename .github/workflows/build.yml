name: KMP Desktop & Server Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Build the Backend Server Application
  # =========================================================================
  build-server:
    name: Build Server Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ensures the Gradle execution script has appropriate system runtime permissions
      - name: Configure Gradle Permissions
        run: chmod +x ./gradlew

      # Compiles the server module. Replace ':server' if your module uses a different name
      - name: Build Server Distribution
        run: ./gradlew :server:build

      # Saves the compiled JAR file as a downloadable build artifact on GitHub
      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-distribution
          path: server/build/libs/*.jar

  # =========================================================================
  # JOB 2: Build Native Clean Desktop Installers (.msi, .dmg, .deb)
  # =========================================================================
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Executes three parallel runners to natively compile OS-specific packages
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Configures script permissions for Unix-based runners (macOS and Linux)
      - name: Configure Gradle Permissions
        if: matrix.os != 'windows-latest'
        run: chmod +x ./gradlew

      # Standardizes the shell to Bash across all environments to process paths uniformly.
      # Packages the app:desktopApp module for the current runner OS.
      - name: Package Desktop App OS-Specific Installer
        shell: bash
        run: ./gradlew :app:desktopApp:packageDistributionForCurrentOS

      # Collects the specific binary format generated by the respective operating system host
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-${{ matrix.os }}
          path: |
            app/desktopApp/build/compose/binaries/main/msi/*.msi
            app/desktopApp/build/compose/binaries/main/dmg/*.dmg
            app/desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn
